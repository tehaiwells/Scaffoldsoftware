# Automatic checks for every push and pull request to main, on Linux and on Windows (the owner's PC runs Windows):
# code layout (Prettier), syntax check, type check, unit tests and a benchmark smoke check, then the browser tests (Playwright's bundled Chromium,
# own throwaway database and port). No retries: a test that only passes the second time is a failure to fix, not to hide.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Check and unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Code layout (npm run format fixes it)
        run: npm run format:check
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - name: Benchmark smoke check (fails when a snapshot gets slow)
        run: npm run benchmark:smoke
  e2e:
    name: Browser tests (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # Linux: a cache hit still needs the OS-level libraries (fast, no download); only a miss needs the browser itself.
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux' && steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: runner.os == 'Linux' && steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npx playwright install chromium
        if: runner.os == 'Windows' && steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npm run test:e2e
        env:
          E2E_PORT: '3100'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
